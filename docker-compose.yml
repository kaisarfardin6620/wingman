services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - ./media:/app/media
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  web:
    build: .
    restart: unless-stopped
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - DJANGO_ALLOW_ASYNC_UNSAFE=true
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
      - ./dbs:/app/dbs
      - ./serviceaccountkey.json:/app/serviceaccountkey.json
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/health/'); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATABASES=${DB_NAME} = host=${DB_HOST} port=${DB_PORT} auth_user=${DB_USER} password=${DB_PASSWORD}
      - IGNORE_STARTUP_PARAMETERS=${PGBOUNCER_IGNORE_STARTUP_PARAMETERS}
      - AUTH_TYPE=plain
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=30
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - SERVER_IDLE_TIMEOUT=600
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  celery_ai:
    build: .
    hostname: worker_ai
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512m
          cpus: '0.75'
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - DJANGO_ALLOW_ASYNC_UNSAFE=true
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./dbs:/app/dbs
      - ./serviceaccountkey.json:/app/serviceaccountkey.json
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: celery -A wingman worker --pool=threads --concurrency=20 -Q default -n worker_ai@worker_ai --loglevel=info
    healthcheck:
      test: ["CMD", "celery", "-A", "wingman", "inspect", "ping", "-d", "worker_ai@worker_ai"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  celery_heavy:
    build: .
    hostname: worker_heavy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - DJANGO_ALLOW_ASYNC_UNSAFE=true
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./dbs:/app/dbs
      - ./serviceaccountkey.json:/app/serviceaccountkey.json
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: celery -A wingman worker --pool=prefork --concurrency=2 -Q heavy_queue -n worker_heavy@worker_heavy --loglevel=info
    healthcheck:
      test: ["CMD", "celery", "-A", "wingman", "inspect", "ping", "-d", "worker_heavy@worker_heavy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512m
          cpus: '0.75'

  celery_beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RUNNING_IN_DOCKER=true
      - DJANGO_ALLOW_ASYNC_UNSAFE=true
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - ./dbs:/app/dbs
      - ./serviceaccountkey.json:/app/serviceaccountkey.json
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: celery -A wingman beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: '0.5'

volumes:
  static_volume:
  redis_data: